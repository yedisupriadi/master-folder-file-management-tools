name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include confidential documents, document contents, tokens, or app keys.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Folder Management Tool
        - File Naming Convention Management
        - Child Document Number Generator
        - Aconex Multi Document Number Search
        - Notion Proxy
        - Home page
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open ...\n2. Select ...\n3. Click ..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Microsoft Edge 130 or Google Chrome 130
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Use sanitized sample names or screenshots only.
