<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Folder Management Tool using Supabase as the authoritative source for standard folder structures.">
<title>Folder Management Tool</title>
<style>
  html, body { min-height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #eef2f7; color: #1e293b; font-family: "Segoe UI", Arial, sans-serif; }
  .boot { text-align: center; padding: 28px; }
  .boot strong { display: block; margin-bottom: 8px; }
  .boot span { color: #64748b; font-size: 13px; }
  .boot.error { max-width: 720px; text-align: left; }
</style>
</head>
<body>
<div class="boot" id="boot"><strong>Folder Management Tool</strong><span>Memuat Standard Folder Library…</span></div>
<script>
(async () => {
  const boot = document.getElementById('boot');
  try {
    const [coreResponse, flattenResponse, namingResponse] = await Promise.all([
      fetch('./folder-manager-core.html', { cache: 'no-store' }),
      fetch('./folder-manager-flatten.js', { cache: 'no-store' }),
      fetch('./folder-manager-naming.js', { cache: 'no-store' }),
    ]);
    if (!coreResponse.ok) throw new Error('HTTP ' + coreResponse.status + ' saat memuat folder-manager-core.html');
    if (!flattenResponse.ok) throw new Error('HTTP ' + flattenResponse.status + ' saat memuat folder-manager-flatten.js');
    if (!namingResponse.ok) throw new Error('HTTP ' + namingResponse.status + ' saat memuat folder-manager-naming.js');

    let html = await coreResponse.text();
    const flattenPatch = await flattenResponse.text();
    const namingPatch = await namingResponse.text();

    // Keep the proven Folder Manager engine intact, while presenting Supabase
    // as a user-facing Standard Folder Library instead of exposing database,
    // connection, or Notion-oriented concepts.
    html = html
      .replaceAll('NOTION', 'SUPABASE')
      .replaceAll('Notion', 'Supabase')
      .replaceAll('notion', 'supabase')
      .replaceAll('Database Supabase', 'Standard Folder Library')
      .replaceAll('Supabase Database', 'Standard Folder Library')
      .replaceAll(
        'Tarik database Supabase (live via Worker) → tampilkan di sini → pilih kolom nama folder atau sorot sel yang diinginkan, lalu buat foldernya langsung di folder yang sedang dibuka.',
        'Pilih tipe folder Personal/Project dan levelnya. Standard aktif dimuat langsung dari Supabase, lalu pilih folder yang ingin dibuat pada lokasi yang sedang dibuka.'
      )
      .replaceAll(
        'Tarik database Supabase (live via Worker) → tampilkan di sini → centang baris & kolom yang dipakai, lalu kirim ke grid batch folder di bawah.',
        'Pilih tipe folder Personal/Project dan levelnya. Standard aktif dimuat langsung dari Supabase, lalu pilih folder yang ingin dibuat pada lokasi yang sedang dibuka.'
      )
      .replaceAll(
        'Pull a Supabase database (live via the Worker) → view it here → pick the folder-name column or highlight the cells you want, then create the folders straight into the folder you have open.',
        'Choose Personal/Project folder type and level. Active standards load directly from Supabase, then select the folders you want to create in the location you have open.'
      )
      .replaceAll(
        'Pull a Supabase database (live via the Worker) → view it here → check the rows & columns to use, then send them to the batch-folder grid below.',
        'Choose Personal/Project folder type and level. Active standards load directly from Supabase, then select the folders you want to create in the location you have open.'
      )
      .replaceAll('Loading Supabase database...', 'Loading folder standards...')
      .replaceAll('Memuat database Supabase...', 'Memuat standard folder...')
      .replaceAll('Load / refresh this database from Supabase', 'Refresh this standard from Supabase')
      .replaceAll('Muat / segarkan database ini dari Supabase', 'Segarkan standard ini dari Supabase')
      .replaceAll('Belum ada data. Atur koneksi, pilih database, lalu klik Muat Database.', 'Belum ada data standard. Pilih tipe folder dan level untuk memuat.')
      .replaceAll('No data yet. Configure the connection, choose a database, then click Load Database.', 'No standard data yet. Choose a folder type and level to load it.')
      .replaceAll('untuk database ini', 'untuk standard ini')
      .replaceAll('for this database', 'for this standard')
      .replaceAll('URL Worker:', 'Edge Function URL:')
      .replaceAll('Worker URL:', 'Edge Function URL:')
      .replaceAll('live via Cloudflare Worker', 'live via Supabase Edge Function')
      .replaceAll('live via Worker', 'live via Supabase Edge Function');

    // Enhancements need the Folder Manager's existing local file-system state
    // and helpers. Inject them into the preserved core IIFE instead of
    // duplicating or rewriting the mature Folder Manager implementation.
    const coreClose = html.lastIndexOf('})();');
    if (coreClose < 0) throw new Error('Penutup Folder Manager core tidak ditemukan.');
    html = html.slice(0, coreClose)
      + '\n\n' + flattenPatch.trim()
      + '\n\n' + namingPatch.trim()
      + '\n' + html.slice(coreClose);

    const configTag = '<scr' + 'ipt src="folder-manager-supabase-config.js"></scr' + 'ipt>';
    html = html.replace('</head>', configTag + '\n</head>');

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    boot.classList.add('error');
    boot.innerHTML = '<strong>Folder Management Tool gagal dimuat.</strong>'
      + '<span>Jalankan repository melalui localhost atau GitHub Pages, lalu muat ulang halaman. Detail: '
      + String(error && error.message ? error.message : error) + '</span>';
  }
})();
</script>
</body>
</html>
