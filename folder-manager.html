<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Folder Management Tool using Supabase as the authoritative source for standard folder structures.">
<title>Folder Management Tool</title>
<style>
  html, body { min-height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #eef2f7; color: #1e293b; font-family: "Segoe UI", Arial, sans-serif; }
  .boot { text-align: center; padding: 28px; }
  .boot strong { display: block; margin-bottom: 8px; }
  .boot span { color: #64748b; font-size: 13px; }
  .boot.error { max-width: 720px; text-align: left; }
</style>
</head>
<body>
<div class="boot" id="boot"><strong>Folder Management Tool</strong><span>Memuat standard folder dari Supabase…</span></div>
<script>
(async () => {
  const boot = document.getElementById('boot');
  try {
    const response = await fetch('./folder-manager-core.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status + ' saat memuat folder-manager-core.html');
    let html = await response.text();

    // Keep the proven Folder Manager implementation intact while changing the
    // standard-folder source and visible terminology from Notion to Supabase.
    html = html
      .replaceAll('NOTION', 'SUPABASE')
      .replaceAll('Notion', 'Supabase')
      .replaceAll('notion', 'supabase')
      .replaceAll('Database Supabase', 'Standard Folder — Supabase')
      .replaceAll('Supabase Database', 'Supabase Folder Standards')
      .replaceAll(
        'Tarik database Supabase (live via Worker) → tampilkan di sini → pilih kolom nama folder atau sorot sel yang diinginkan, lalu buat foldernya langsung di folder yang sedang dibuka.',
        'Tarik standard folder langsung dari Supabase → pilih tabel Personal/Project dan levelnya → pilih kolom nama folder atau sorot sel yang diinginkan → buat foldernya di folder yang sedang dibuka.'
      )
      .replaceAll(
        'Tarik database Supabase (live via Worker) → tampilkan di sini → centang baris & kolom yang dipakai, lalu kirim ke grid batch folder di bawah.',
        'Tarik standard folder langsung dari Supabase → pilih tabel Personal/Project dan levelnya → gunakan data sebagai struktur folder pada lokasi yang sedang dibuka.'
      )
      .replaceAll(
        'Pull a Supabase database (live via the Worker) → view it here → pick the folder-name column or highlight the cells you want, then create the folders straight into the folder you have open.',
        'Load folder standards directly from Supabase → choose the Personal/Project table and level → pick the folder-name column or highlight cells → create the folders in the location you have open.'
      )
      .replaceAll('Loading Supabase database...', 'Loading Supabase folder standards...')
      .replaceAll('Memuat database Supabase...', 'Memuat standard folder Supabase...')
      .replaceAll('Load / refresh this database from Supabase', 'Load / refresh this folder standard from Supabase')
      .replaceAll('Muat / segarkan database ini dari Supabase', 'Muat / segarkan standard folder ini dari Supabase')
      .replaceAll('URL Worker:', 'Edge Function URL:')
      .replaceAll('Worker URL:', 'Edge Function URL:')
      .replaceAll('live via Cloudflare Worker', 'live via Supabase Edge Function')
      .replaceAll('live via Worker', 'live via Supabase Edge Function');

    const configTag = '<scr' + 'ipt src="folder-manager-supabase-config.js"></scr' + 'ipt>';
    html = html.replace('</head>', configTag + '\n</head>');

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    boot.classList.add('error');
    boot.innerHTML = '<strong>Folder Management Tool gagal dimuat.</strong>'
      + '<span>Jalankan repository melalui localhost atau GitHub Pages, lalu muat ulang halaman. Detail: '
      + String(error && error.message ? error.message : error) + '</span>';
  }
})();
</script>
</body>
</html>
