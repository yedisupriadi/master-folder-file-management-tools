# Konfigurasi minimal untuk deploy via Wrangler CLI (opsional — bisa juga
# deploy lewat dashboard Cloudflare tanpa file ini).
#
#   npx wrangler@latest login
#   npx wrangler@latest secret put NOTION_TOKEN
#   npx wrangler@latest secret put APP_KEY
#   npx wrangler@latest deploy
#
# ALLOWED_DB opsional — daftar Database ID (pisah koma) yang boleh dibaca.

name = "notion-proxy"
main = "worker.js"
compatibility_date = "2026-08-02"

[secrets]
required = ["NOTION_TOKEN", "APP_KEY"]

# [vars]
# ALLOWED_DB = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx,yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy"
