<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A browser-based suite for document control, file naming, folder management, child document numbering, and Aconex searches.">
<title>Master Folder &amp; File Management Tools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%2241.325%20309.180%20194.000%20194.000%22%3E%3Cpath%20fill%3D%22%23D27F37%22%20d%3D%22M145.701%2C311.18L145.701%2C501.18C168.217%2C499.429%20189.406%2C489.7%20205.5%2C473.557C223.342%2C455.662%20233.325%2C431.488%20233.325%2C406.18C233.325%2C402.101%20233.066%2C398.051%20232.556%2C394.052L220.371%2C397.164C220.696%2C400.144%20220.862%2C403.154%20220.862%2C406.18C220.862%2C428.141%20212.168%2C449.193%20196.686%2C464.722C186.475%2C474.963%20173.868%2C482.243%20160.186%2C486.013L160.186%2C365.211L184.997%2C446.484L214.733%2C374.871C215.801%2C377.495%20216.736%2C380.173%20217.531%2C382.897L229.623%2C379.808C225.219%2C364.452%20216.989%2C350.325%20205.5%2C338.803C189.406%2C322.66%20168.217%2C312.931%20145.701%2C311.18ZM130.799%2C311.192C108.339%2C312.974%2087.209%2C322.696%2071.15%2C338.803C60.978%2C349.005%2053.36%2C361.25%2048.69%2C374.581L62.936%2C372.454C67.009%2C363.295%2072.746%2C354.868%2079.954%2C347.638C90.13%2C337.432%20102.686%2C330.166%20116.314%2C326.385L116.314%2C358.29L60.258%2C379.275L60.258%2C379.273L45.766%2C384.687C44.156%2C391.674%2043.325%2C398.88%2043.325%2C406.18C43.325%2C431.487%2053.309%2C455.662%2071.15%2C473.557C87.208%2C489.664%20108.338%2C499.385%20130.799%2C501.168L130.799%2C402.295L104.219%2C410.165L108.32%2C424.1L117.421%2C421.405L116.748%2C486.094C102.952%2C482.347%2090.238%2C475.036%2079.954%2C464.721C64.472%2C449.193%2055.777%2C428.14%2055.777%2C406.18C55.777%2C402.839%2055.979%2C399.519%2056.374%2C396.236L75.34%2C389.137L75.34%2C431.621L89.825%2C431.621L89.825%2C383.714L130.799%2C368.376L130.799%2C323.733L130.799%2C311.192ZM163.804%2C327.433C176.088%2C331.432%20187.381%2C338.306%20196.686%2C347.639C200.061%2C351.024%20203.114%2C354.672%20205.824%2C358.535L187.079%2C403.678L163.804%2C327.433Z%22%2F%3E%3C%2Fsvg%3E">
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-family);
    font-weight: 400;
    background: linear-gradient(180deg, var(--bg-grad-a) 0%, var(--bg-grad-b) 240px) fixed;
    color: var(--ink);
    padding: 22px 26px;
    min-height: 100vh;
    transition: background .2s, color .2s;
  }
  .ico { display: inline-flex; align-items: center; justify-content: center; color: var(--brand); flex-shrink: 0; }
  .ico svg { display: block; }

  /* ---------- Topbar: toggle bahasa & tema (pojok kanan atas) ---------- */
  .topbar {
    position: fixed; top: 14px; right: 18px; z-index: 200;
    display: flex; align-items: center; gap: 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; box-shadow: 0 6px 20px -8px rgba(15,23,42,.25);
  }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--muted); -webkit-user-select: none; user-select: none; }
  .toggle .t-lab { min-width: 26px; text-align: center; }
  .toggle .t-lab.on { color: var(--brand); }
  .switch { position: relative; width: 46px; height: 24px; flex-shrink: 0; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .slider { position: absolute; inset: 0; border-radius: 999px; background: #cbd5e1; transition: background .18s; }
  .switch .slider::before {
    content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: transform .18s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .switch input:checked + .slider { background: #034F53; }
  .switch input:checked + .slider::before { transform: translateX(22px); }
  .topbar .divider { width: 1px; height: 22px; background: var(--line); }

  /* ---------- Header ---------- */
  .header { display: flex; align-items: center; gap: 14px; margin: 8px 0 6px; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: var(--brand);
  }
  .header h1 { font-size: 22px; letter-spacing: -.3px; font-weight: 700; }
  .header .subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; font-weight: 300; }

  /* ---------- Grid daftar tools ---------- */
  .tools-wrap { max-width: 1080px; margin: 26px auto 0; }
  .tools-label {
    font-size: 12px; font-weight: 700; letter-spacing: .6px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
  }
  .tools-grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .tool-card {
    position: relative; display: flex; gap: 14px; align-items: flex-start;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 18px 16px;
    box-shadow: 0 1px 2px rgba(15,23,42,.06), 0 8px 24px -12px rgba(15,23,42,.12);
    text-decoration: none; color: inherit;
    transition: transform .12s ease, box-shadow .15s ease, border-color .15s ease;
  }
  a.tool-card:hover {
    transform: translateY(-2px);
    border-color: var(--brand);
    box-shadow: 0 4px 8px rgba(15,23,42,.08), 0 16px 32px -12px rgba(15,23,42,.2);
  }
  a.tool-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tool-num {
    width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px;
    background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
  }
  html[data-theme="dark"] .tool-num { background: #034F53; }
  .tool-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
  .tool-title { display: flex; align-items: center; gap: 8px; font-size: 15.5px; font-weight: 700; }
  .tool-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .tool-open {
    margin-top: 8px; display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 700; color: var(--brand);
  }
  .tool-open .ico svg { transition: transform .12s ease; }
  a.tool-card:hover .tool-open .ico svg { transform: translateX(3px); }

  /* kartu placeholder: slot untuk tool berikutnya */
  .tool-card.placeholder {
    border-style: dashed; box-shadow: none; background: transparent;
    align-items: center; justify-content: center; min-height: 110px;
    color: var(--muted); font-size: 12.5px; font-weight: 600; text-align: center;
  }

  .footer { max-width: 1080px; margin: 34px auto 0; text-align: center; color: var(--muted); font-size: 11.5px; font-weight: 300; }
</style>
<link rel="stylesheet" href="styles/tool-ui.css">
<script src="scripts/tool-ui.js"></script>
</head>
<body>

<div class="topbar">
  <label class="toggle" title="Bahasa / Language">
    <span class="t-lab" id="labID">ID</span>
    <span class="switch"><input type="checkbox" id="langToggle" aria-label="Bahasa / Language"><span class="slider"></span></span>
    <span class="t-lab" id="labEN">EN</span>
  </label>
  <span class="divider"></span>
  <label class="toggle" title="Light / Dark">
    <span class="ico" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg></span>
    <span class="switch"><input type="checkbox" id="themeToggle" aria-label="Light / Dark"><span class="slider"></span></span>
    <span class="ico" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span>
  </label>
</div>

<div class="header">
  <div class="logo"><span class="ico"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span></div>
  <div>
    <h1 data-i18n="homeTitle">Master Folder &amp; File Management Tools</h1>
    <div class="subtitle" data-i18n="homeSubtitle">Kumpulan tools all-in-one untuk pengelolaan file & folder dokumen — pilih tool di bawah untuk mulai</div>
  </div>
</div>

<div class="tools-wrap">
  <div class="tools-label" data-i18n="toolsLabel">Daftar Tools</div>
  <div class="tools-grid" id="toolsGrid"></div>
</div>

<div class="footer" data-i18n="homeFooter">Tambahkan tool baru lewat array TOOLS di dalam file ini — nomor urut mengikuti urutan daftar secara otomatis.</div>

<script>
(() => {
  'use strict';

  /* =====================================================================
     KONFIGURASI TOOLS — satu-satunya tempat yang perlu diubah saat
     menambah tool baru. Tambahkan entri baru di AKHIR array; nomor urut
     (1, 2, 3, ...) mengikuti urutan array secara otomatis.

     Struktur entri:
       href : nama file HTML tool (relatif terhadap index.html)
       icon : path/shape SVG (stroke, viewBox 24x24, tanpa tag <svg>)
       name : { id: '...', en: '...' }  → judul tool
       desc : { id: '...', en: '...' }  → deskripsi singkat
     ===================================================================== */
  const TOOLS = [
    {
      href: 'folder-manager.html',
      icon: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="10" x2="12" y2="16"/><line x1="9" y1="13" x2="15" y2="13"/>',
      name: {
        id: 'Folder Management Tool',
        en: 'Folder Management Tool'
      },
      desc: {
        id: 'Kelola folder & file gaya Explorer: pohon navigasi, salin/pindah/hapus/rename, cek folder kosong, dan buat banyak folder sekaligus dari spreadsheet.',
        en: 'Explorer-style folder & file management: navigation tree, copy/move/delete/rename, find empty folders, and batch-create folders from a spreadsheet.'
      }
    },
    {
      href: 'file-naming-convention.html',
      icon: '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><path d="M9 14h7"/><path d="M9 17.5h4"/>',
      name: {
        id: 'File Naming Convention Management',
        en: 'File Naming Convention Management'
      },
      desc: {
        id: 'Kelola penamaan file: scan folder, cek struktur nama, crosscheck dengan register Excel, deteksi duplikat berdasarkan isi file, rename, flatten, dan pindahkan file.',
        en: 'Manage file naming: scan folders, check naming structure, crosscheck against the Excel register, detect duplicates by file content, rename, flatten, and move files.'
      }
    },
    {
      href: 'child-number-generator.html',
      icon: '<path d="M3 3v6h6"/><path d="M3 9a9 9 0 1 1 3 6.7"/><path d="M12 7v5l3 2"/>',
      name: {
        id: 'Child Document Number Generator',
        en: 'Child Document Number Generator'
      },
      desc: {
        id: 'Buat nomor dokumen anak otomatis dari nomor induk bertanda ~ — dari satu parent, atau isi tabel Parent/Child sekaligus lalu salin ke Excel.',
        en: 'Generate child document numbers from a parent number with a ~ range — from a single parent, or fill a whole Parent/Child table at once and copy to Excel.'
      }
    },
    {
      href: 'aconex-search-generator.html',
      icon: '<circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/><line x1="8" y1="9.5" x2="14" y2="9.5"/><line x1="8" y1="12.5" x2="12" y2="12.5"/>',
      name: {
        id: 'Aconex Multi Document Number Search',
        en: 'Aconex Multi Document Number Search'
      },
      desc: {
        id: 'Ubah satu kolom daftar document number jadi query docno:(... OR ...) siap paste ke kolom Search Document Register Aconex — daftar panjang dipecah otomatis.',
        en: 'Turn a single column of document numbers into a docno:(... OR ...) query ready to paste into the Aconex Document Register Search box — long lists are split automatically.'
      }
    },
    {
      href: 'sharepoint-link-cleaner.html',
      icon: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/><path d="m9 12 2 2 4-5"/>',
      name: {
        id: 'SharePoint Link Cleaner',
        en: 'SharePoint Link Cleaner'
      },
      desc: {
        id: 'Bersihkan link sharing SharePoint secara massal menjadi URL file langsung dan URL folder, lalu salin, unduh, atau kirim hasilnya ke URL Builder.',
        en: 'Clean SharePoint sharing links in bulk into direct file and folder URLs, then copy, download, or send the result to URL Builder.'
      }
    },
    {
      href: 'sharepoint-url-builder.html',
      icon: '<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/><path d="M5 5v14"/>',
      name: { id: 'URL Builder', en: 'URL Builder' },
      desc: {
        id: 'Buat URL file SharePoint secara massal dari satu folder dan daftar nama file, dengan pembersihan nama, export CSV, serta OCR screenshot opsional.',
        en: 'Build SharePoint file URLs in bulk from one folder and a file-name list, with name cleanup, CSV export, and optional screenshot OCR.'
      }
    }
    // Tool #7 dan seterusnya: tambahkan entri baru di sini.
  ];

  // ---------- I18N (teks statis home page) ----------
  const I18N = {
    id: {
      homeTitle: 'Master Folder & File Management Tools',
      homeSubtitle: 'Kumpulan tools all-in-one untuk pengelolaan file & folder dokumen — pilih tool di bawah untuk mulai',
      toolsLabel: 'Daftar Tools',
      openTool: 'Buka Tool',
      nextSlot: 'Slot tool berikutnya — tool baru akan tampil di sini',
      homeFooter: 'Tambahkan tool baru lewat array TOOLS di dalam file ini — nomor urut mengikuti urutan daftar secara otomatis.'
    },
    en: {
      homeTitle: 'Master Folder & File Management Tools',
      homeSubtitle: 'All-in-one toolset for document file & folder management — pick a tool below to start',
      toolsLabel: 'Tool List',
      openTool: 'Open Tool',
      nextSlot: 'Next tool slot — new tools will appear here',
      homeFooter: 'Add a new tool via the TOOLS array inside this file — numbering follows the list order automatically.'
    }
  };

  let lang = ToolStorage.getItem('audit-lang') || 'id';
  const TR = (key) => (I18N[lang] && key in I18N[lang]) ? I18N[lang][key] : I18N.id[key];
  const TXT = (obj) => obj[lang] || obj.id;

  // ---------- Render daftar tools ----------
  const SVG_OPEN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

  function renderTools() {
    const grid = document.getElementById('toolsGrid');
    grid.innerHTML = '';
    TOOLS.forEach((tool, i) => {
      const a = document.createElement('a');
      a.className = 'tool-card';
      a.href = tool.href;
      a.innerHTML =
        '<span class="tool-num">' + (i + 1) + '</span>' +
        '<span class="tool-body">' +
          '<span class="tool-title"><span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + tool.icon + '</svg></span><span></span></span>' +
          '<span class="tool-desc"></span>' +
          '<span class="tool-open"><span></span><span class="ico">' + SVG_OPEN + '</span></span>' +
        '</span>';
      a.querySelector('.tool-title span:last-child').textContent = TXT(tool.name);
      a.querySelector('.tool-desc').textContent = TXT(tool.desc);
      a.querySelector('.tool-open span:first-child').textContent = TR('openTool');
      grid.appendChild(a);
    });
    // slot placeholder untuk tool berikutnya
    const ph = document.createElement('div');
    ph.className = 'tool-card placeholder';
    ph.textContent = (TOOLS.length + 1) + ' — ' + TR('nextSlot');
    grid.appendChild(ph);
  }

  // ---------- Bahasa ----------
  function applyStaticI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = TR(el.getAttribute('data-i18n')); if (v != null) el.textContent = v;
    });
    document.documentElement.lang = lang;
    document.title = TR('homeTitle');
  }
  function updateLangLabels() {
    document.getElementById('labID').classList.toggle('on', lang === 'id');
    document.getElementById('labEN').classList.toggle('on', lang === 'en');
    document.getElementById('langToggle').checked = (lang === 'en');
  }
  function setLang(l) {
    lang = (l === 'en') ? 'en' : 'id';
    ToolStorage.setItem('audit-lang', lang);   // key sama dengan audit-tool agar preferensi konsisten antar halaman
    applyStaticI18n();
    updateLangLabels();
    renderTools();
  }

  // ---------- Tema ----------
  function setTheme(theme) {
    const t = (theme === 'dark') ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    ToolStorage.setItem('audit-theme', t);     // key sama dengan audit-tool agar preferensi konsisten antar halaman
    document.getElementById('themeToggle').checked = (t === 'dark');
  }

  // init sedini mungkin (data-theme) supaya tak ada flash
  document.documentElement.setAttribute('data-theme', ToolStorage.getItem('audit-theme') || 'light');

  document.addEventListener('DOMContentLoaded', () => {
    applyStaticI18n();
    updateLangLabels();
    renderTools();
    setTheme(ToolStorage.getItem('audit-theme') || 'light');
    document.getElementById('langToggle').addEventListener('change', e => setLang(e.target.checked ? 'en' : 'id'));
    document.getElementById('themeToggle').addEventListener('change', e => setTheme(e.target.checked ? 'dark' : 'light'));
  });
})();
</script>
</body>
</html>
